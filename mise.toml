# Generated by `pnpm eject`. Pinned toolchain for this standalone app, mirroring
# the gauntlet-turbo monorepo versions so Gradle / CocoaPods cache keys line up.
#
# New here?
#   brew install mise
#   mise run bootstrap

[tools]
node = "24.15.0"
pnpm = "11.1.3"               # mirrors package.json#packageManager
ruby = "3.4.9"                # drives Gemfile.lock + native gem builds → deterministic Pods/
java = "temurin-17.0.19+10"   # full patch matters: Gradle cache key includes it

[env]
# Android SDK lives outside mise (shared with Android Studio + brew).
ANDROID_HOME     = "{{ env.HOME }}/Library/Android/sdk"
ANDROID_SDK_ROOT = "{{ env.HOME }}/Library/Android/sdk"

# v8's 4GB default heap OOMs on a large `pnpm i`.
NODE_OPTIONS = "--max-old-space-size=8192"

_.path = [
  "{{ env.HOME }}/Library/Android/sdk/platform-tools",
  "{{ env.HOME }}/Library/Android/sdk/emulator",
  "{{ env.HOME }}/Library/Android/sdk/cmdline-tools/latest/bin",
]

[tasks.bootstrap]
description = "One-shot dev setup: install toolchain + pnpm install"
run = """
mise install
pnpm install
"""
