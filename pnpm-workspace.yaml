# Local integration packages (created via `pnpm create-integration`) are
# workspace members so the app can import them by name.
packages:
  - packages/*

# Generated by `pnpm eject`. This dir is the workspace root: pnpm reads patches
# / build allow-list / release-age excludes from here (not package.json#pnpm).

# Mehery SDK depends on async-storage ^2.2.0; host native links 3.x.
# Force one version so Mehery JS matches the TurboModule in the app binary.
# Note: 3.x legacy export drops multiGet/Set/Remove — host adds a v2-compat
# shim via rspack alias (src/mehery/asyncStorageCompat.ts).
overrides:
  '@react-native-async-storage/async-storage': 3.1.1
  # Mehery pulls react-native-video ^6.17 → 6.19.x; host pins 6.16.1.
  # Two copies both call requireNativeComponent('RCTVideo') and crash.
  react-native-video: 6.16.1

minimumReleaseAgeExclude:
  - '@rebid-engineering/react-native-rebid'
  - 'react-native-kwikpass'
  - '@app-brew/*'
  - '@gauntlet/*'
  - '@rsbuild/core@2.0.11'
  - react-native-pushapp-appbrew@1.0.2

patchedDependencies:
  react-native-render-html: patches/react-native-render-html.patch
  'react-native-date-picker@5.0.13': patches/react-native-date-picker@5.0.13.patch

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  core-js: false
  protobufjs: true
  sharp: true
