# Local integration packages (created via `pnpm create-integration`) are
# workspace members so the app can import them by name.
packages:
  - packages/*

# Generated by `pnpm eject`. This dir is the workspace root: pnpm reads patches
# / build allow-list / release-age excludes from here (not package.json#pnpm).

minimumReleaseAgeExclude:
  - '@rebid-engineering/react-native-rebid'
  - 'react-native-kwikpass'
  - '@app-brew/*'
  - '@gauntlet/*'
  - '@rsbuild/core@2.0.11'

patchedDependencies:
  react-native-render-html: patches/react-native-render-html.patch
  'react-native-date-picker@5.0.13': patches/react-native-date-picker@5.0.13.patch

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  core-js: false
  protobufjs: true
  sharp: true
